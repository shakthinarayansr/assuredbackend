services:
  postgres:
    image: postgres:17-alpine
    container_name: assuredgig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assuredgig
      POSTGRES_PASSWORD: assuredgig
      POSTGRES_DB: assuredgig
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assuredgig']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: assuredgig-valkey
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  valkey-data:
